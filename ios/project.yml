# =============================================================================
# XcodeGen manifest for The Reading Room iOS app.
#
# Generate the .xcodeproj with:
#   brew install xcodegen   (once)
#   cd ios && xcodegen
#
# Debug builds use Config/Dev.xcconfig (dev Supabase project);
# Release/Archive builds use Config/Prod.xcconfig (prod Supabase project).
# =============================================================================
name: ReadingRoom
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""            # set once enrolled; auto-signing fills the rest

targets:
  ReadingRoom:
    type: application
    platform: iOS
    sources:
      - path: ReadingRoom
    configFiles:
      Debug: Config/Dev.xcconfig
      Release: Config/Prod.xcconfig
    # Push Notifications capability. XcodeGen generates the entitlements file
    # from these properties and wires CODE_SIGN_ENTITLEMENTS automatically.
    # Debug builds get the APNs sandbox ("development"); Release/archive builds
    # override aps-environment to "production" below for the App Store gateway.
    entitlements:
      path: ReadingRoom/Support/ReadingRoom.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        INFOPLIST_FILE: ReadingRoom/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: ReadingRoom/Support/ReadingRoom.entitlements.production
    dependencies:
      - package: Supabase
        product: Supabase

  ReadingRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReadingRoomTests
    dependencies:
      - target: ReadingRoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  ReadingRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReadingRoomUITests
    dependencies:
      - target: ReadingRoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ReadingRoom:
    build:
      targets:
        ReadingRoom: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReadingRoomTests
        - ReadingRoomUITests
      environmentVariables:
        # Service-layer tests sign in two DEV test users by password, mirroring
        # tests/run.mjs. Fill these locally (or via a .env your runner injects);
        # never commit real credentials.
        TEST_A_EMAIL: ""
        TEST_A_PASSWORD: ""
        TEST_B_EMAIL: ""
        TEST_B_PASSWORD: ""
    archive:
      config: Release
